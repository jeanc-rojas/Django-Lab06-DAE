{% extends "layout.html" %}

{% block content %}
<div class="card mt-4">
  {% if producto.imagen %}
    <img class="card-img-top img-fluid" src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" style="max-height: 400px; object-fit: contain;">
  {% else %}
    <img class="card-img-top img-fluid" src="http://placehold.it/900x400" alt="">
  {% endif %}
  <div class="card-body">
    <h3 class="card-title">{{ producto.nombre }}</h3>
    <h4>S/ {{ producto.precio }}</h4>
    <p class="card-text">Categoría: {{ producto.categoria.nombre }}</p>
    <p class="card-text">Stock disponible: {{ producto.stock }} unidades</p>
  </div>
</div>
{% endblock %}
